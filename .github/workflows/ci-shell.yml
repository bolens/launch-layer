# Reusable shell suite — called from ci.yml when shell paths change.
# shellcheck runs alone; bats unit + integration run as a matrix.
name: CI / Shell

on:
  workflow_call:

permissions:
  contents: read

jobs:
  mcp-python-minimum:
    name: MCP / Python 3.9 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: bats
          version: 1.0

      - name: MCP tests
        run: bats test/unit/mcp.bats

  bash-minimum:
    name: Bash 4.3 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned Bash 4.3.30
        env:
          BASH_ARCHIVE_SHA256: 317881019bbf2262fb814b7dd8e40632d13c3608d2f237800a8828fbb8a640dd
        run: |
          curl --fail --location --silent --show-error --output /tmp/bash-4.3.30.tar.gz https://ftp.gnu.org/gnu/bash/bash-4.3.30.tar.gz
          echo "$BASH_ARCHIVE_SHA256  /tmp/bash-4.3.30.tar.gz" | sha256sum --check
          tar -C /tmp -xzf /tmp/bash-4.3.30.tar.gz
          cd /tmp/bash-4.3.30
          CC=gcc CFLAGS=-std=gnu89 ./configure --prefix=/tmp/bash-4.3-install --without-bash-malloc
          make -j2
          make install

      - name: Syntax and entrypoint smoke tests
        run: |
          find launchlayer lib scripts -type f \( -name '*.sh' -o -name 'launchlayer' \) -print0 | xargs -0 -n1 /tmp/bash-4.3-install/bin/bash -n
          /tmp/bash-4.3-install/bin/bash ./launchlayer --version
          /tmp/bash-4.3-install/bin/bash ./launchlayer --help >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{}}}' | /tmp/bash-4.3-install/bin/bash ./launchlayer --mcp | grep -q '"name":"launchlayer"'

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: shellcheck
          version: 1.0

      - name: Shellcheck
        run: make shellcheck

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            shard: 0
            shards: 2
          - suite: unit
            shard: 1
            shards: 2
          - suite: integration
            shard: 0
            shards: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: bats python3 parallel
          version: 1.1

      - name: Prepare vm.max_map_count for doctor tests
        run: sudo sysctl -w vm.max_map_count=2147483642

      - name: Bats ${{ matrix.suite }}
        run: make test-${{ matrix.suite }} TEST_SHARD=${{ matrix.shard }} TEST_SHARDS=${{ matrix.shards }}

  portability:
    name: Portability / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bats on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install Bats on macOS
        if: runner.os == 'macOS'
        run: brew install bash bats-core

      - name: Platform-sensitive unit tests without systemd
        env:
          DBUS_SESSION_BUS_ADDRESS: ""
          XDG_RUNTIME_DIR: ""
        run: bats test/unit/platform.bats test/unit/cpu.bats test/unit/systemd-backup.bats test/unit/preflight.bats
