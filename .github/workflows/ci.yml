name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      hub: ${{ steps.filter.outputs.hub }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shell:
              - 'lib/**'
              - 'launchlayer'
              - 'launch.d/**'
              - 'scripts/**'
              - 'share/**'
              - 'test/**'
              - 'Makefile'
              - '.shellcheckrc'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'docs/README.md'
              - 'docs/cli.md'
              - 'docs/tui.md'
              - 'docs/third-party.md'
              - 'docs/release_runbook.md'
              - 'docs/architecture-diagram.json'
              - 'docs/architecture-diagram.sha256'
              - 'site/**'
              - '.github/workflows/ci-shell.yml'
              - '.github/workflows/ci.yml'
            hub:
              - 'hub/**'
              - 'package.json'
              - '.node-version'
              - 'scripts/hub-pm.sh'
              - 'docs/architecture.md'
              - '.github/workflows/ci-hub.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/hub-audit.yml'
            workflows:
              - '.github/workflows/**'

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" actionlint

      - name: Run actionlint
        run: ./actionlint -color

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    uses: ./.github/workflows/ci-shell.yml

  supply_chain:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce dependency pins and integrity hashes
        run: bash scripts/check-dependency-pins.sh

      - name: Download Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" gitleaks

      - name: Scan repository history for secrets
        run: ./gitleaks git --redact --no-banner .

  hub:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    uses: ./.github/workflows/ci-hub.yml

  # Always runs. Require this job name ("ci") in branch protection.
  # Succeeds when path-filtered suites are skipped; fails if a needed suite failed.
  ci:
    needs: [changes, actionlint, shell, hub, supply_chain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate path-filtered results
        run: |
          set -euo pipefail
          shell_needed='${{ needs.changes.outputs.shell }}'
          hub_needed='${{ needs.changes.outputs.hub }}'
          workflows_needed='${{ needs.changes.outputs.workflows }}'
          shell_result='${{ needs.shell.result }}'
          hub_result='${{ needs.hub.result }}'
          changes_result='${{ needs.changes.result }}'
          actionlint_result='${{ needs.actionlint.result }}'
          supply_chain_result='${{ needs.supply_chain.result }}'

          echo "changes=$changes_result actionlint_needed=$workflows_needed actionlint=$actionlint_result shell_needed=$shell_needed shell=$shell_result hub_needed=$hub_needed hub=$hub_result"

          if [[ "$changes_result" != "success" ]]; then
            echo "changes job did not succeed"
            exit 1
          fi

          if [[ "$supply_chain_result" != "success" ]]; then
            echo "supply-chain job did not succeed: $supply_chain_result"
            exit 1
          fi

          if [[ "$workflows_needed" == "true" && "$actionlint_result" != "success" ]]; then
            echo "actionlint required but result was: $actionlint_result"
            exit 1
          fi

          if [[ "$shell_needed" == "true" && "$shell_result" != "success" ]]; then
            echo "shell suite required but result was: $shell_result"
            exit 1
          fi

          if [[ "$hub_needed" == "true" && "$hub_result" != "success" ]]; then
            echo "hub suite required but result was: $hub_result"
            exit 1
          fi

          echo "CI gate green"
