name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      workflows: ${{ steps.filter.outputs.workflows }}
      editor: ${{ steps.filter.outputs.editor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shell:
              - '.woodpecker/**'
              - 'lib/**'
              - 'launchlayer'
              - 'launch.d/**'
              - 'scripts/**'
              - 'share/**'
              - 'test/**'
              - 'Makefile'
              - '.shellcheckrc'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'docs/README.md'
              - 'docs/cli.md'
              - 'docs/tui.md'
              - 'docs/third-party.md'
              - 'docs/release_runbook.md'
              - 'docs/architecture-diagram.json'
              - 'docs/architecture-diagram.sha256'
              - 'site/**'
              - '.github/workflows/ci-shell.yml'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
            editor:
              - '.devcontainer/**'
              - '.github/workflows/ci.yml'
              - 'hub/package.json'
              - 'hub/pnpm-lock.yaml'
              - 'hub/pnpm-workspace.yaml'

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@b179e4783aca035374a85da9676e0be893fa1701
    with:
      security-audit: true

  pages:
    name: Pages / validated artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Pages site
        run: make check-pages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages-site
          path: site
          if-no-files-found: error
          retention-days: 1

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    uses: ./.github/workflows/ci-shell.yml
    with:
      full_linux_validation: false
      minimum_runtime_validation: false

  editor:
    name: Editor devcontainer
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and initialize the editor devcontainer
        run: |
          set -euo pipefail
          image="localhost/launchlayer-editor:${GITHUB_SHA}"
          trap 'docker image rm "$image" >/dev/null' EXIT
          docker build --tag "$image" --file .devcontainer/Dockerfile .devcontainer
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 1g \
            --cpus 2 --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,size=512m \
            --env HOME=/tmp/editor-home \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
            --workdir /workspace "$image" bash .devcontainer/post-create.sh

  # Always runs. Require this job name ("ci") in branch protection.
  # Succeeds when path-filtered suites are skipped; fails if a needed suite failed.
  ci:
    needs: [changes, actionlint, pages, shell, editor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate path-filtered results
        run: |
          set -euo pipefail
          shell_needed='${{ needs.changes.outputs.shell }}'
          workflows_needed='${{ needs.changes.outputs.workflows }}'
          shell_result='${{ needs.shell.result }}'
          changes_result='${{ needs.changes.result }}'
          actionlint_result='${{ needs.actionlint.result }}'
          pages_result='${{ needs.pages.result }}'
          editor_needed='${{ needs.changes.outputs.editor }}'
          editor_result='${{ needs.editor.result }}'

          echo "changes=$changes_result actionlint_needed=$workflows_needed actionlint=$actionlint_result pages=$pages_result shell_needed=$shell_needed shell=$shell_result"

          if [[ "$changes_result" != "success" ]]; then
            echo "changes job did not succeed"
            exit 1
          fi

          if [[ "$pages_result" != "success" ]]; then
            echo "Pages artifact job did not succeed: $pages_result"
            exit 1
          fi

          if [[ "$workflows_needed" == "true" && "$actionlint_result" != "success" ]]; then
            echo "actionlint required but result was: $actionlint_result"
            exit 1
          fi

          if [[ "$shell_needed" == "true" && "$shell_result" != "success" ]]; then
            echo "shell suite required but result was: $shell_result"
            exit 1
          fi

          if [[ "$editor_needed" == "true" && "$editor_result" != "success" ]]; then
            echo "editor devcontainer required but result was: $editor_result"
            exit 1
          fi

          echo "CI gate green"
